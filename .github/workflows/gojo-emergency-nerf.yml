name: One-shot Gojo emergency nerf

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gojo-emergency-nerf.yml'

permissions:
  contents: write

jobs:
  nerf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Gojo balance nerf
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  n = s.count(old)
                  if n < 1:
                      raise SystemExit(f'{path}: expected at least 1 match, got {n}: {old[:120]!r}')
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          patch('index.html', [
              ('infinityMax:3, infinityDelay:gs(2), infinityStep:gs(4), purpleLock:gs(3),',
               'infinityMax:2, infinityDelay:gs(3), infinityStep:gs(5.5), purpleLock:gs(4),'),
              ('basic:[20,20,35], basicCd:gs(.65), basicRange:92, basicStun:gs(.4), basicPull:58,',
               'basic:[18,18,28], basicCd:gs(.75), basicRange:92, basicStun:gs(.3), basicPull:48,'),
              ('blueDmg:70, blueSplash:40, blueCd:gs(7), blueWind:gs(.45), blueRange:390,',
               'blueDmg:55, blueSplash:30, blueCd:gs(8.5), blueWind:gs(.55), blueRange:370,'),
              ('blueRadius:96, blueMax:3, blueStun:gs(.8), bluePull:210,',
               'blueRadius:90, blueMax:2, blueStun:gs(.6), bluePull:180,'),
              ('redDmg:100, redCd:gs(9), redWind:gs(.6), redBreak:gs(.4), redSpeed:430,',
               'redDmg:80, redCd:gs(11), redWind:gs(.7), redBreak:gs(.45), redSpeed:420,'),
              ('redStun:gs(1), redKb:930, // exponential knock() decay integrates to roughly 25% of the 620px arena',
               'redStun:gs(.75), redKb:780, // nerfed knockback keeps Red strong without resetting the whole fight'),
              ('purpleDmg:180, purpleSecond:.70, purpleCd:gs(18), purpleWind:gs(1.4),',
               'purpleDmg:150, purpleSecond:.60, purpleCd:gs(22), purpleWind:gs(1.6),'),
              ('purpleSpeed:360, purplePierce:2, purpleKb:1080,',
               'purpleSpeed:340, purplePierce:2, purpleKb:930,'),
              ('domainCd:gs(26), domainWind:gs(1), domainBreak:gs(.7), domainRange:260,',
               'domainCd:gs(32), domainWind:gs(1.2), domainBreak:gs(.8), domainRange:240,'),
              ('overloadT:gs(3), overwhelmedT:gs(4), overwhelmedMove:.50, overwhelmedAtk:.60, overwhelmedCast:.60,',
               'overloadT:gs(2), overwhelmedT:gs(3), overwhelmedMove:.65, overwhelmedAtk:.75, overwhelmedCast:.75,'),
              ('pw:{dmg:78,dur:91,mob:61,as:79,rng:82,cc:95,uti:90,con:86,cmb:20},',
               'pw:{dmg:68,dur:78,mob:61,as:72,rng:78,cc:84,uti:82,con:74,cmb:20},'),
              ('behind three finite Infinity charges.', 'behind two finite Infinity charges.'),
              ('Three shared charges each negate one direct hit.', '${GOJO.infinityMax} shared charges each negate one direct hit.'),
          ])

          patch('tools/t_gojo.js', [
              ("ok(near(cfg.entrance,1.5)&&cfg.basic.join('/')==='20/20/35'&&cfg.basicCd===.65,",
               "ok(near(cfg.entrance,1.5)&&cfg.basic.join('/')==='18/18/28'&&cfg.basicCd===.75,"),
              ("ok(cfg.blue.join('/')==='70/40/7/0.45/0.8'&&cfg.red.join('/')==='100/9/0.6/0.4/1',",
               "ok(cfg.blue.join('/')==='55/30/8.5/0.55/0.6'&&cfg.red.join('/')==='80/11/0.7/0.45/0.75',"),
              ("ok(cfg.purple.join('/')==='180/0.7/18/1.4/3'&&cfg.domain.join('/')==='26/1/0.7/3/4',",
               "ok(cfg.purple.join('/')==='150/0.6/22/1.6/4'&&cfg.domain.join('/')==='32/1.2/0.8/2/3',"),
              ("ok(cfg.inf.join('/')==='3/2/4','Infinity is three charges with 2s delay and 4s recharge');",
               "ok(cfg.inf.join('/')==='2/3/5.5','Infinity is two charges with 3s delay and 5.5s recharge');"),
              ("ok(cfg.chart.cmb<=25&&cfg.chart.cc>=90,'power chart reflects no low-HP comeback and elite control');",
               "ok(cfg.chart.cmb<=25&&cfg.chart.cc>=80&&cfg.chart.dur<=80,'power chart reflects no low-HP comeback and strong but bounded control');"),
              ('f.gojoEntry=null;f.gojoHide=false;f.hp=1000;f.maxHp=1000;f.infinity=3;f.infinityLock=0;f.infinityDelay=0;f.infinityTick=0;',
               'f.gojoEntry=null;f.gojoHide=false;f.hp=1000;f.maxHp=1000;f.infinity=2;f.infinityLock=0;f.infinityDelay=0;f.infinityTick=0;'),
              ("window.__hurt(f,30,e,false,'big');window.__hurt(f,30,e,false,'big');\n    const empty=f.infinity,h2=f.hp;window.__hurt(f,30,e,false,'big');const exposed=h2-f.hp;",
               "window.__hurt(f,30,e,false,'big');\n    const empty=f.infinity,h2=f.hp;window.__hurt(f,30,e,false,'big');const exposed=h2-f.hp;"),
              ('f.infinity=2;f.infinityDelay=X.infinityDelay;f.infinityTick=0;',
               'f.infinity=1;f.infinityDelay=X.infinityDelay;f.infinityTick=0;'),
              ("ok(inf.before===2&&inf.after===3,'passive recharge waits 2s, then restores one charge after 4s');",
               "ok(inf.before===1&&inf.after===2,'passive recharge waits 3s, then restores one charge after 5.5s');"),
              ("ok(skills.blue===70&&skills.restored===2,'Blue deals 70 and restores exactly one shared Infinity charge');",
               "ok(skills.blue===55&&skills.restored===2,'Blue deals 55 and restores exactly one shared Infinity charge');"),
              ('prep();f.infinity=3;h=e.hp;window.__gojoPurple(f,e);const spent=f.infinity,lock=f.infinityLock*window.__RT,ang=f.gojoAct.ang;',
               'prep();f.infinity=2;h=e.hp;window.__gojoPurple(f,e);const spent=f.infinity,lock=f.infinityLock*window.__RT,ang=f.gojoAct.ang;'),
              ('prep();f.infinity=3;e.dmgRes=.5;h=e.hp;window.__gojoPurple(f,e);for(let i=0;i<500&&(f.gojoAct||f.gojoShots.length);i++)window.__gojoTick(f,1/120);',
               'prep();f.infinity=2;e.dmgRes=.5;h=e.hp;window.__gojoPurple(f,e);for(let i=0;i<500&&(f.gojoAct||f.gojoShots.length);i++)window.__gojoTick(f,1/120);'),
              ("ok(skills.spent===0&&near(skills.lock,3,.04)&&skills.missed===0,'Purple consumes all charges immediately and can miss its fixed line');",
               "ok(skills.spent===0&&near(skills.lock,4,.04)&&skills.missed===0,'Purple consumes all charges immediately and can miss its fixed line');"),
              ("ok(near(skills.purple,117,.01),'Purple ignores 30% of a target\\'s 50% damage reduction',skills.purple);",
               "ok(near(skills.purple,97.5,.01),'Purple ignores 30% of a target\\'s 50% damage reduction',skills.purple);"),
              ("ok(domain.damage===0&&near(domain.over,3,.04)&&near(domain.stun,3,.04),\n    'Unlimited Void applies 3s Information Overload and deals 0 damage');",
               "ok(domain.damage===0&&near(domain.over,2,.04)&&near(domain.stun,2,.04),\n    'Unlimited Void applies 2s Information Overload and deals 0 damage');"),
              ("ok(near(domain.overwhelmed,4,.04)&&domain.move===.5&&domain.cast===.6,\n    'Information Overload transitions to 4s Overwhelmed: −50% move, −40% attack/cast');",
               "ok(near(domain.overwhelmed,3,.04)&&domain.move===.65&&domain.cast===.75,\n    'Information Overload transitions to 3s Overwhelmed: −35% move, −25% attack/cast');"),
          ])

          patch('README.md', [
              ('quản lý ba Infinity Charge hữu hạn', 'quản lý hai Infinity Charge hữu hạn'),
          ])

          patch('CLAUDE.md', [
              ('`Infinity` là một pool dùng chung đúng 3 charge.', '`Infinity` là một pool dùng chung đúng 2 charge.'),
              ('Sau hit gần nhất chờ 2 giây, rồi mỗi 4 giây hồi một.', 'Sau hit gần nhất chờ 3 giây, rồi mỗi 5.5 giây hồi một.'),
              ('`Limitless Combat` là basic 20/20/35 ở nhịp 0.65 giây.', '`Limitless Combat` là basic 18/18/28 ở nhịp 0.75 giây.'),
              ('sau 0.45 giây kéo tối đa 3 địch; main 70, secondary 40,\n  stun 0.8 giây.', 'sau 0.55 giây kéo tối đa 2 địch; main 55, secondary 30,\n  stun 0.6 giây.'),
              ('Purple tiêu sạch charge ngay lúc bắt đầu, khoá hồi tự nhiên 3 giây, xuyên tối đa hai\n  fighter (180 / 126)', 'Purple tiêu sạch charge ngay lúc bắt đầu, khoá hồi tự nhiên 4 giây, xuyên tối đa hai\n  fighter (150 / 90)'),
              ('`Information Overload` 3 giây; sau đó `Overwhelmed` 4 giây (−50% move, −40% attack/cast).', '`Information Overload` 2 giây; sau đó `Overwhelmed` 3 giây (−35% move, −25% attack/cast).'),
          ])
          PY

          python3 tools/mk_play.py

      - name: Commit balance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html play.html tools/t_gojo.js README.md CLAUDE.md
          git commit -m 'balance: emergency nerf Satoru Gojo'
          git push origin HEAD:main
