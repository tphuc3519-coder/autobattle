name: Update Conan eight clues

on:
  push:
    branches: [balance/conan-clue-rework]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Run Conan eight-clue update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/conan-clue-rework
      - name: Apply update
        run: |
          set -e
          python3 tools/update_conan_8clues.py
          python3 tools/mk_play.py
      - name: Validate
        run: |
          set -e
          node tools/t_conan.js
          python3 - <<'PY'
          import pathlib,re,subprocess
          for html in ('index.html','play.html'):
              text=pathlib.Path(html).read_text(encoding='utf-8')
              for i,b in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',text,re.S)):
                  f=pathlib.Path(f'/tmp/{html}-{i}.js'); f.write_text(b,encoding='utf-8')
                  subprocess.run(['node','--check',str(f)],check=True)
          PY
          git diff --check
      - name: Commit final update
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-conan-clues.yml tools/update_conan_8clues.py .conan-8clue-trigger
          git add index.html play.html README.md CLAUDE.md tools/t_conan.js
          git commit -m "Count auxiliary clues toward Conan Case Solved"
          git push origin HEAD:balance/conan-clue-rework
